<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vinylBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="courtVinyl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#vinylBg)"/>
  <!-- Field outline -->
  <rect x="80" y="50" width="640" height="400" rx="6" fill="url(#courtVinyl)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.9"/>
  <!-- Center line and circle -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="400" cy="250" r="70" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="400" cy="250" r="4" fill="#ffffff"/>
  <!-- Penalty Areas -->
  <path d="M 80 160 A 90 90 0 0 1 170 250 A 90 90 0 0 1 80 340" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="140" cy="250" r="4" fill="#ffffff"/>
  <path d="M 720 160 A 90 90 0 0 0 630 250 A 90 90 0 0 0 720 340" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="660" cy="250" r="4" fill="#ffffff"/>
  <!-- Goals -->
  <rect x="60" y="210" width="20" height="80" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="3"/>
  <rect x="720" y="210" width="20" height="80" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="475" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">FUTSAL VINYL PRO INDOOR</text>
</svg>
