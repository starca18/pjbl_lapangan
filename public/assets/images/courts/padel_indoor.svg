<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="padelInBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="padelTurf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#padelInBg)"/>
  <!-- Glass Enclosure wall effect -->
  <rect x="90" y="60" width="620" height="380" rx="6" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
  <rect x="95" y="65" width="610" height="370" fill="url(#padelTurf)" stroke="#ffffff" stroke-width="4"/>
  <!-- Glass Corner accents -->
  <line x1="90" y1="60" x2="130" y2="60" stroke="#bae6fd" stroke-width="8"/>
  <line x1="90" y1="60" x2="90" y2="100" stroke="#bae6fd" stroke-width="8"/>
  <line x1="710" y1="60" x2="670" y2="60" stroke="#bae6fd" stroke-width="8"/>
  <line x1="710" y1="60" x2="710" y2="100" stroke="#bae6fd" stroke-width="8"/>
  <line x1="90" y1="440" x2="130" y2="440" stroke="#bae6fd" stroke-width="8"/>
  <line x1="90" y1="440" x2="90" y2="400" stroke="#bae6fd" stroke-width="8"/>
  <line x1="710" y1="440" x2="670" y2="440" stroke="#bae6fd" stroke-width="8"/>
  <line x1="710" y1="440" x2="710" y2="400" stroke="#bae6fd" stroke-width="8"/>
  <!-- Service lines (3m from back wall) -->
  <line x1="210" y1="65" x2="210" y2="435" stroke="#ffffff" stroke-width="3"/>
  <line x1="590" y1="65" x2="590" y2="435" stroke="#ffffff" stroke-width="3"/>
  <!-- Center service line -->
  <line x1="210" y1="250" x2="590" y2="250" stroke="#ffffff" stroke-width="3"/>
  <!-- Padel Net -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#e0f2fe" stroke-width="6"/>
  <circle cx="400" cy="50" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="450" r="5" fill="#38bdf8"/>
  <text x="400" y="475" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">PADEL PANORAMIC TEMPERED GLASS (INDOOR)</text>
</svg>
