<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="grassCourt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grassBg)"/>
  <!-- Field outline -->
  <rect x="80" y="50" width="640" height="400" rx="4" fill="url(#grassCourt)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.95"/>
  <!-- Alternating grass stripes -->
  <rect x="80" y="50" width="80" height="400" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="240" y="50" width="80" height="400" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="400" y="50" width="80" height="400" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="560" y="50" width="80" height="400" fill="#ffffff" fill-opacity="0.06"/>
  <!-- Center line and circle -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#ffffff" stroke-width="4"/>
  <circle cx="400" cy="250" r="70" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="400" cy="250" r="4" fill="#ffffff"/>
  <!-- Penalty areas -->
  <path d="M 80 160 A 90 90 0 0 1 170 250 A 90 90 0 0 1 80 340" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="140" cy="250" r="4" fill="#ffffff"/>
  <path d="M 720 160 A 90 90 0 0 0 630 250 A 90 90 0 0 0 720 340" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="660" cy="250" r="4" fill="#ffffff"/>
  <!-- Goals -->
  <rect x="60" y="210" width="20" height="80" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="3"/>
  <rect x="720" y="210" width="20" height="80" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="475" fill="#86efac" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">FUTSAL RUMPUT SINTETIS PREMIUM</text>
</svg>
