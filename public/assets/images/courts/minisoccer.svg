<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="msTurf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#msBg)"/>
  <!-- Field outline -->
  <rect x="70" y="45" width="660" height="410" rx="4" fill="url(#msTurf)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.95"/>
  <!-- Mowed grass horizontal stripes -->
  <rect x="70" y="45" width="660" height="51" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="70" y="147" width="660" height="51" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="70" y="249" width="660" height="51" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="70" y="351" width="660" height="51" fill="#ffffff" fill-opacity="0.05"/>
  <!-- Halfway line & center circle -->
  <line x1="400" y1="45" x2="400" y2="455" stroke="#ffffff" stroke-width="4"/>
  <circle cx="400" cy="250" r="75" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="400" cy="250" r="4" fill="#ffffff"/>
  <!-- Penalty Boxes -->
  <rect x="70" y="135" width="130" height="230" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="70" y="185" width="45" height="130" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="160" cy="250" r="4" fill="#ffffff"/>
  <path d="M 200 210 A 50 50 0 0 1 200 290" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <rect x="600" y="135" width="130" height="230" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="685" y="185" width="45" height="130" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="640" cy="250" r="4" fill="#ffffff"/>
  <path d="M 600 210 A 50 50 0 0 0 600 290" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Goals -->
  <rect x="50" y="205" width="20" height="90" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="3"/>
  <rect x="730" y="205" width="20" height="90" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="480" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">MINI SOCCER ARENA 7v7 MONOFILAMENT</text>
</svg>
