<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="padelOutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="padelOutTurf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#padelOutBg)"/>
  <!-- Sunset mood / Outdoor court -->
  <rect x="90" y="60" width="620" height="380" rx="6" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.8"/>
  <rect x="95" y="65" width="610" height="370" fill="url(#padelOutTurf)" stroke="#ffffff" stroke-width="4"/>
  <!-- Service lines -->
  <line x1="210" y1="65" x2="210" y2="435" stroke="#ffffff" stroke-width="3"/>
  <line x1="590" y1="65" x2="590" y2="435" stroke="#ffffff" stroke-width="3"/>
  <!-- Center service line -->
  <line x1="210" y1="250" x2="590" y2="250" stroke="#ffffff" stroke-width="3"/>
  <!-- Padel Net -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#fecdd3" stroke-width="6"/>
  <circle cx="400" cy="50" r="5" fill="#f43f5e"/>
  <circle cx="400" cy="450" r="5" fill="#f43f5e"/>
  <text x="400" y="475" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">PADEL SUNSET ARENA (OUTDOOR)</text>
</svg>
