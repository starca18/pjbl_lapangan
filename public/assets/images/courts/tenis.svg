<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tenisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="tenisCourt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tenisBg)"/>
  <!-- Tennis court outline -->
  <rect x="110" y="70" width="580" height="360" fill="url(#tenisCourt)" stroke="#ffffff" stroke-width="4"/>
  <!-- Singles lines -->
  <line x1="110" y1="120" x2="690" y2="120" stroke="#ffffff" stroke-width="3"/>
  <line x1="110" y1="380" x2="690" y2="380" stroke="#ffffff" stroke-width="3"/>
  <!-- Service boxes -->
  <line x1="230" y1="120" x2="230" y2="380" stroke="#ffffff" stroke-width="3"/>
  <line x1="570" y1="120" x2="570" y2="380" stroke="#ffffff" stroke-width="3"/>
  <!-- Center service line -->
  <line x1="230" y1="250" x2="570" y2="250" stroke="#ffffff" stroke-width="3"/>
  <!-- Center mark at baselines -->
  <line x1="110" y1="250" x2="125" y2="250" stroke="#ffffff" stroke-width="3"/>
  <line x1="675" y1="250" x2="690" y2="250" stroke="#ffffff" stroke-width="3"/>
  <!-- Tennis Net -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#f1f5f9" stroke-width="6"/>
  <circle cx="400" cy="50" r="6" fill="#0f172a"/>
  <circle cx="400" cy="450" r="6" fill="#0f172a"/>
  <text x="400" y="475" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">TENIS HARD COURT PLEXIPAVE OUTDOOR</text>
</svg>
