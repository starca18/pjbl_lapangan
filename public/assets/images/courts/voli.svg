<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="voliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="voliCourt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#voliBg)"/>
  <!-- Free zone border -->
  <rect x="110" y="70" width="580" height="360" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
  <!-- Playing court 18m x 9m -->
  <rect x="150" y="110" width="500" height="280" fill="url(#voliCourt)" stroke="#ffffff" stroke-width="4"/>
  <!-- Center Line under Net -->
  <line x1="400" y1="110" x2="400" y2="390" stroke="#ffffff" stroke-width="5"/>
  <!-- Attack lines (3m from center) -->
  <line x1="320" y1="110" x2="320" y2="390" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="480" y1="110" x2="480" y2="390" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- Volleyball Net -->
  <line x1="400" y1="85" x2="400" y2="415" stroke="#f8fafc" stroke-width="6"/>
  <circle cx="400" cy="85" r="7" fill="#dc2626"/>
  <circle cx="400" cy="415" r="7" fill="#dc2626"/>
  <text x="400" y="475" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">BOLA VOLI INDOOR PBVSI PRO</text>
</svg>
