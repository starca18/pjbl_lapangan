<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="badmintonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="badmintonMat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#badmintonBg)"/>
  <!-- Court Mat Outer -->
  <rect x="100" y="70" width="600" height="360" rx="3" fill="url(#badmintonMat)" stroke="#ffffff" stroke-width="4"/>
  <!-- Doubles sidelines (outer rect) -->
  <!-- Singles sidelines -->
  <line x1="100" y1="95" x2="700" y2="95" stroke="#ffffff" stroke-width="3"/>
  <line x1="100" y1="405" x2="700" y2="405" stroke="#ffffff" stroke-width="3"/>
  <!-- Doubles long service line (back lines) -->
  <line x1="130" y1="70" x2="130" y2="430" stroke="#ffffff" stroke-width="3"/>
  <line x1="670" y1="70" x2="670" y2="430" stroke="#ffffff" stroke-width="3"/>
  <!-- Short service lines -->
  <line x1="320" y1="70" x2="320" y2="430" stroke="#ffffff" stroke-width="3"/>
  <line x1="480" y1="70" x2="480" y2="430" stroke="#ffffff" stroke-width="3"/>
  <!-- Center line -->
  <line x1="100" y1="250" x2="320" y2="250" stroke="#ffffff" stroke-width="3"/>
  <line x1="480" y1="250" x2="700" y2="250" stroke="#ffffff" stroke-width="3"/>
  <!-- Net line in middle -->
  <line x1="400" y1="55" x2="400" y2="445" stroke="#f59e0b" stroke-width="5" stroke-dasharray="6 3"/>
  <circle cx="400" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="400" cy="445" r="5" fill="#f59e0b"/>
  <text x="400" y="475" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">BADMINTON BWF STANDARD (MATRAS HIJAU)</text>
</svg>
